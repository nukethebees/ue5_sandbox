[package]
name = "benchmark-tools"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
plotters = { version = "0.3.7", default-features = false, features = ["svg_backend", "line_series", "errorbar"] }

[dev-dependencies]
ioj-test-support.workspace = true
